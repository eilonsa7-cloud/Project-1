<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MindDump" />
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <title>MindDump — Clear Your Head</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f1a;
      --surface: #1a1a2e;
      --surface2: #16213e;
      --accent: #7c3aed;
      --accent2: #a78bfa;
      --text: #f1f0ff;
      --muted: #8b8ba8;
      --done: #22c55e;
      --danger: #ef4444;
      --border: rgba(124,58,237,0.2);
      --radius: 14px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    /* ---- HEADER ---- */
    header {
      padding: 16px 20px 12px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .logo {
      font-size: 18px;
      font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions { display: flex; gap: 8px; align-items: center; }

    .icon-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
      border-radius: 10px;
      padding: 8px 10px;
      cursor: pointer;
      font-size: 16px;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .icon-btn:active { background: var(--accent); }

    .api-badge {
      font-size: 11px;
      padding: 4px 8px;
      border-radius: 6px;
      background: rgba(239,68,68,0.15);
      color: #fca5a5;
      border: 1px solid rgba(239,68,68,0.3);
      cursor: pointer;
    }
    .api-badge.ok {
      background: rgba(34,197,94,0.15);
      color: #86efac;
      border-color: rgba(34,197,94,0.3);
    }

    /* ---- TABS ---- */
    .tabs {
      display: flex;
      background: var(--surface);
      padding: 0 12px;
      border-bottom: 1px solid var(--border);
      gap: 4px;
    }
    .tab {
      flex: 1;
      padding: 10px 4px;
      text-align: center;
      font-size: 12px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
    }
    .tab.active {
      color: var(--accent2);
      border-bottom-color: var(--accent2);
    }

    /* ---- MAIN CONTENT ---- */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .view { display: none; flex-direction: column; flex: 1; overflow: hidden; }
    .view.active { display: flex; }

    /* ---- DUMP VIEW ---- */
    .dump-area {
      flex: 1;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
    }

    .brain-prompt {
      text-align: center;
      padding: 20px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }
    .brain-prompt .emoji { font-size: 40px; display: block; margin-bottom: 12px; }
    .brain-prompt strong { color: var(--accent2); }

    .messages { display: flex; flex-direction: column; gap: 10px; }

    .msg {
      max-width: 88%;
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.6;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--accent);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .msg.assistant {
      align-self: flex-start;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }
    .msg.assistant[dir="rtl"] { text-align: right; }
    .msg.system-note {
      align-self: center;
      background: rgba(124,58,237,0.1);
      border: 1px dashed var(--border);
      color: var(--muted);
      font-size: 12px;
      max-width: 100%;
      text-align: center;
    }
    .msg.thinking {
      align-self: flex-start;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
      color: var(--muted);
      font-style: italic;
      font-size: 13px;
    }

    .thinking-dots span {
      animation: blink 1.2s infinite;
      opacity: 0;
    }
    .thinking-dots span:nth-child(2) { animation-delay: 0.4s; }
    .thinking-dots span:nth-child(3) { animation-delay: 0.8s; }
    @keyframes blink { 0%,80%,100%{opacity:0} 40%{opacity:1} }

    /* ---- INPUT BAR ---- */
    .input-bar {
      padding: 12px 12px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-wrap {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      display: flex;
      align-items: flex-end;
      padding: 2px 4px;
      transition: border-color 0.2s;
    }
    .input-wrap:focus-within { border-color: var(--accent2); }

    #msgInput {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 15px;
      padding: 10px 10px;
      resize: none;
      max-height: 100px;
      line-height: 1.4;
      font-family: inherit;
    }
    #msgInput::placeholder { color: var(--muted); }

    .voice-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 20px;
      padding: 8px 8px;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      align-self: flex-end;
    }
    .voice-btn.recording {
      color: var(--danger);
      animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.15)} }

    .send-btn {
      background: var(--accent);
      border: none;
      color: #fff;
      font-size: 18px;
      width: 42px;
      height: 42px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .send-btn:active { background: #5b21b6; }
    .send-btn:disabled { background: var(--surface2); color: var(--muted); }

    /* ---- TASKS VIEW ---- */
    .tasks-header {
      padding: 16px 16px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .tasks-title { font-size: 16px; font-weight: 700; }
    .count-badge {
      background: var(--accent);
      color: #fff;
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 20px;
    }

    .filter-bar {
      padding: 0 12px 12px;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .filter-bar::-webkit-scrollbar { display: none; }
    .filter-chip {
      flex-shrink: 0;
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      background: var(--surface2);
      color: var(--muted);
      border: 1px solid var(--border);
      -webkit-tap-highlight-color: transparent;
      transition: all 0.2s;
    }
    .filter-chip.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .task-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .task-item {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
      display: flex;
      gap: 10px;
      align-items: flex-start;
      transition: opacity 0.2s;
    }
    .task-item.done { opacity: 0.5; }

    .task-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid var(--accent2);
      flex-shrink: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      color: transparent;
      transition: all 0.2s;
      -webkit-tap-highlight-color: transparent;
      margin-top: 1px;
    }
    .task-check.done {
      background: var(--done);
      border-color: var(--done);
      color: #fff;
    }

    .task-content { flex: 1; min-width: 0; }
    .task-text {
      font-size: 14px;
      line-height: 1.5;
      word-break: break-word;
    }
    .task-item.done .task-text { text-decoration: line-through; color: var(--muted); }

    .task-meta {
      display: flex;
      gap: 6px;
      margin-top: 6px;
      flex-wrap: wrap;
    }
    .tag {
      font-size: 10px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .tag-urgent { background: rgba(239,68,68,0.2); color: #fca5a5; }
    .tag-today  { background: rgba(245,158,11,0.2); color: #fcd34d; }
    .tag-later  { background: rgba(34,197,94,0.15); color: #86efac; }
    .tag-waiting{ background: rgba(99,102,241,0.2); color: #a5b4fc; }
    .tag-default{ background: rgba(139,139,168,0.15); color: var(--muted); }

    .task-del {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
      padding: 2px 4px;
      border-radius: 6px;
      -webkit-tap-highlight-color: transparent;
      flex-shrink: 0;
    }
    .task-del:active { color: var(--danger); }

    .empty-tasks {
      text-align: center;
      padding: 40px 20px;
      color: var(--muted);
      font-size: 14px;
    }
    .empty-tasks .emoji { font-size: 40px; display: block; margin-bottom: 12px; }

    /* ---- SETTINGS MODAL ---- */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      z-index: 200;
      align-items: flex-end;
    }
    .overlay.open { display: flex; }

    .sheet {
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      padding: 20px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      border-top: 1px solid var(--border);
    }

    .sheet-handle {
      width: 36px;
      height: 4px;
      background: var(--muted);
      border-radius: 2px;
      margin: 0 auto 20px;
      opacity: 0.4;
    }

    .sheet h3 {
      font-size: 16px;
      margin-bottom: 16px;
      color: var(--accent2);
    }

    .field { margin-bottom: 16px; }
    .field label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .field input, .field select {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 14px;
      outline: none;
      font-family: inherit;
    }
    .field input:focus, .field select:focus { border-color: var(--accent2); }

    .btn-primary {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }

    /* ---- VOICE INDICATOR ---- */
    .voice-indicator {
      display: none;
      position: fixed;
      bottom: 100px;
      left: 50%;
      transform: translateX(-50%);
      background: var(--danger);
      color: #fff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      z-index: 300;
      box-shadow: 0 4px 20px rgba(239,68,68,0.4);
      animation: pulse 1s infinite;
    }
    .voice-indicator.active { display: block; }

    /* ---- LANG TOGGLE ---- */
    .lang-toggle {
      font-size: 12px;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 8px;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
      cursor: pointer;
    }

    /* scrollbars */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    @media (min-width: 500px) {
      body { max-width: 480px; margin: 0 auto; }
    }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <div class="logo">🧠 MindDump</div>
  <div class="header-actions">
    <button class="lang-toggle" id="langToggle" onclick="toggleLang()">EN</button>
    <span class="api-badge" id="apiBadge" onclick="openSettings()">No API Key</span>
    <button class="icon-btn" onclick="openSettings()">⚙️</button>
  </div>
</header>

<!-- Tabs -->
<div class="tabs">
  <div class="tab active" onclick="switchTab('dump')">💬 Brain Dump</div>
  <div class="tab" onclick="switchTab('tasks')">✅ Tasks <span id="taskTabCount"></span></div>
</div>

<!-- Main -->
<main>

  <!-- DUMP VIEW -->
  <div class="view active" id="view-dump">
    <div class="dump-area" id="chatArea">
      <div class="brain-prompt" id="welcomeMsg">
        <span class="emoji">🧠</span>
        <strong>What's in your head?</strong><br><br>
        Dump everything — tasks, worries, ideas, reminders.<br>
        I'll help you sort it out.<br><br>
        <span style="font-size:12px;color:var(--muted)">Type or tap 🎤 to speak — Hebrew or English</span>
      </div>
      <div class="messages" id="messages"></div>
    </div>
    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="msgInput" rows="1" placeholder="What's on your mind..."
          oninput="autoResize(this)" onkeydown="handleKey(event)"></textarea>
        <button class="voice-btn" id="voiceBtn" onclick="toggleVoice()" title="Voice input">🎤</button>
      </div>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
          <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- TASKS VIEW -->
  <div class="view" id="view-tasks">
    <div class="tasks-header">
      <span class="tasks-title">Your Missions</span>
      <span class="count-badge" id="taskCount">0</span>
    </div>
    <div class="filter-bar">
      <div class="filter-chip active" onclick="filterTasks('all', this)">All</div>
      <div class="filter-chip" onclick="filterTasks('urgent', this)">🔥 Urgent</div>
      <div class="filter-chip" onclick="filterTasks('today', this)">📅 Today</div>
      <div class="filter-chip" onclick="filterTasks('later', this)">🌙 Later</div>
      <div class="filter-chip" onclick="filterTasks('waiting', this)">⏳ Waiting</div>
      <div class="filter-chip" onclick="filterTasks('done', this)">✅ Done</div>
    </div>
    <div class="task-list" id="taskList"></div>
  </div>

</main>

<!-- Voice indicator -->
<div class="voice-indicator" id="voiceIndicator">🎤 Listening...</div>

<!-- Settings Sheet -->
<div class="overlay" id="settingsOverlay" onclick="closeSettingsOnBg(event)">
  <div class="sheet">
    <div class="sheet-handle"></div>
    <h3>⚙️ Settings</h3>
    <div class="field">
      <label>Claude API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off" />
    </div>
    <div class="field">
      <label>Your Name (optional)</label>
      <input type="text" id="nameInput" placeholder="How should I call you?" />
    </div>
    <div class="field">
      <label>Default Language</label>
      <select id="defaultLang">
        <option value="en-US">English</option>
        <option value="he-IL">Hebrew / עברית</option>
      </select>
    </div>
    <button class="btn-primary" onclick="saveSettings()">Save</button>
  </div>
</div>

<script type="module">
import Anthropic from 'https://esm.sh/@anthropic-ai/sdk@0.36.3';

// ============================================================
// SERVICE WORKER
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.js').catch(() => {});
}

// STATE
// ============================================================
let tasks = JSON.parse(localStorage.getItem('md_tasks') || '[]');
let settings = JSON.parse(localStorage.getItem('md_settings') || '{}');
let conversation = [];
let currentFilter = 'all';
let isRecording = false;
let recognition = null;
let currentLang = settings.lang || 'en-US';
let isHebrew = currentLang === 'he-IL';

const SYSTEM_PROMPT = `You are a personal assistant and task manager called MindDump.
Your job is to help the user clear their head and organize their missions/tasks.

The user might write or speak in English or Hebrew — respond in the same language they used.

When the user dumps thoughts, tasks, or worries:
1. First, acknowledge briefly what they shared (1 sentence max, warm but direct)
2. Ask ONE clarifying question if something is vague, OR if the input is clear enough, go straight to organizing
3. Extract tasks and output them as a JSON block like this at the end of your message:

\`\`\`tasks
[
  {"text": "task description", "priority": "urgent|today|later|waiting"},
  ...
]
\`\`\`

Priority guide:
- urgent: needs attention NOW, blocking other things, or time-sensitive
- today: should be done today but not emergency
- later: can wait, backlog
- waiting: blocked on someone else or needs more info

Rules:
- Be warm, human, no corporate speak
- Keep responses SHORT — 2-4 sentences max before the task list
- If the user is venting, acknowledge feelings first, then extract action items
- If there are no clear tasks, just ask what they want to do about it
- Support Hebrew fully — detect it and respond in Hebrew when used
- Never lecture or moralize
- If user writes in Hebrew, respond ENTIRELY in Hebrew

CRITICAL — avoid duplicate tasks:
- You will receive the user's current task list at the start of each message
- Before adding any task, check if a similar task already exists (same subject/intent)
- If it already exists, do NOT add it again — even if the wording is slightly different
- Only emit a \`\`\`tasks block if there are genuinely NEW tasks to add
- If everything mentioned is already in the list, just reply conversationally — no tasks block`;

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
  loadSettings();
  renderTasks();
  updateSendBtn();

  document.getElementById('msgInput').addEventListener('input', updateSendBtn);

  // Setup voice
  setupVoice();
});

function loadSettings() {
  if (settings.apiKey) {
    document.getElementById('apiBadge').textContent = 'AI Ready';
    document.getElementById('apiBadge').className = 'api-badge ok';
  }
  document.getElementById('apiKeyInput').value = settings.apiKey || '';
  document.getElementById('nameInput').value = settings.name || '';
  document.getElementById('defaultLang').value = settings.lang || 'en-US';
  currentLang = settings.lang || 'en-US';
  isHebrew = currentLang === 'he-IL';
  updateLangToggle();
}

// ============================================================
// TABS
// ============================================================
function switchTab(tab) {
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', ['dump','tasks'][i] === tab);
  });
  document.querySelectorAll('.view').forEach(v => {
    v.classList.toggle('active', v.id === 'view-' + tab);
  });
}

// ============================================================
// MESSAGING
// ============================================================
function updateSendBtn() {
  const val = document.getElementById('msgInput').value.trim();
  document.getElementById('sendBtn').disabled = !val;
}

function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    if (document.getElementById('msgInput').value.trim()) sendMessage();
  }
}

function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text) return;

  // Hide welcome
  document.getElementById('welcomeMsg').style.display = 'none';

  input.value = '';
  input.style.height = 'auto';
  updateSendBtn();

  addMsg(text, 'user');
  conversation.push({ role: 'user', content: text });

  if (!settings.apiKey) {
    addMsg("Please add your Claude API key in Settings (⚙️) to enable AI features. Your tasks will still be saved manually.", 'assistant');
    return;
  }

  const thinking = addThinking();

  try {
    const reply = await callClaude(conversation);
    thinking.remove();

    // Parse tasks from response
    const { message, newTasks } = parseResponse(reply);

    const isHeb = detectHebrew(reply);
    const msgEl = addMsg(message, 'assistant');
    if (isHeb) msgEl.setAttribute('dir', 'rtl');

    conversation.push({ role: 'assistant', content: reply });

    if (newTasks.length > 0) {
      const normalize = s => s.toLowerCase().replace(/[\s\u0591-\u05C7]/g, ' ').replace(/\s+/g, ' ').trim();
      const existingNorm = tasks.filter(t => !t.done).map(t => normalize(t.text));

      const deduped = newTasks.filter(t => {
        const n = normalize(t.text);
        // Skip if any existing task shares 60%+ of words
        return !existingNorm.some(existing => {
          const newWords = new Set(n.split(' '));
          const exWords = existing.split(' ');
          const shared = exWords.filter(w => newWords.has(w)).length;
          return exWords.length > 0 && shared / exWords.length >= 0.6;
        });
      });

      if (deduped.length > 0) {
        deduped.forEach(t => {
          tasks.push({
            id: Date.now() + Math.random(),
            text: t.text,
            priority: t.priority || 'today',
            done: false,
            created: new Date().toISOString()
          });
        });
        saveTasks();
        renderTasks();
        addMsg(`✅ Added ${deduped.length} task${deduped.length > 1 ? 's' : ''} to your list`, 'system-note');
      }
    }

    scrollChat();
  } catch (err) {
    thinking.remove();
    addMsg(`Error: ${err.message}`, 'system-note');
  }
}

async function callClaude(messages) {
  const client = new Anthropic({
    apiKey: settings.apiKey,
    dangerouslyAllowBrowser: true
  });

  // Inject current task list so Claude can avoid duplicates
  const activeTasks = tasks.filter(t => !t.done);
  const taskContext = activeTasks.length > 0
    ? `\n\nCurrent task list (DO NOT duplicate these):\n${activeTasks.map(t => `- [${t.priority}] ${t.text}`).join('\n')}`
    : '\n\nCurrent task list: (empty)';

  const response = await client.messages.create({
    model: 'claude-opus-4-6',
    max_tokens: 1024,
    system: SYSTEM_PROMPT + taskContext,
    messages: messages.slice(-20)
  });

  return response.content[0].text;
}

function parseResponse(text) {
  const taskBlockRegex = /```tasks\n([\s\S]*?)```/;
  const match = text.match(taskBlockRegex);
  let newTasks = [];
  let message = text;

  if (match) {
    try {
      newTasks = JSON.parse(match[1]);
      // Remove the tasks block from displayed message
      message = text.replace(taskBlockRegex, '').trim();
    } catch (e) {
      // ignore parse error, show full message
    }
  }

  return { message, newTasks };
}

function detectHebrew(text) {
  return /[\u0590-\u05FF]/.test(text);
}

function addMsg(text, type) {
  const container = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg ' + type;
  el.textContent = text;
  container.appendChild(el);
  scrollChat();
  return el;
}

function addThinking() {
  const container = document.getElementById('messages');
  const el = document.createElement('div');
  el.className = 'msg thinking';
  el.innerHTML = 'Thinking <span class="thinking-dots"><span>.</span><span>.</span><span>.</span></span>';
  container.appendChild(el);
  scrollChat();
  return el;
}

function scrollChat() {
  const area = document.getElementById('chatArea');
  requestAnimationFrame(() => { area.scrollTop = area.scrollHeight; });
}

// ============================================================
// VOICE
// ============================================================
function setupVoice() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    document.getElementById('voiceBtn').style.display = 'none';
    return;
  }
  recognition = new SpeechRecognition();
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const transcript = Array.from(event.results)
      .map(r => r[0].transcript).join('');
    const input = document.getElementById('msgInput');
    input.value = (input.value + ' ' + transcript).trim();
    autoResize(input);
    updateSendBtn();
    stopVoice();
  };

  recognition.onerror = () => stopVoice();
  recognition.onend = () => stopVoice();
}

function toggleVoice() {
  if (isRecording) {
    stopVoice();
  } else {
    startVoice();
  }
}

function startVoice() {
  if (!recognition) return;
  recognition.lang = currentLang;
  try {
    recognition.start();
    isRecording = true;
    document.getElementById('voiceBtn').classList.add('recording');
    document.getElementById('voiceIndicator').classList.add('active');
  } catch(e) {}
}

function stopVoice() {
  if (!recognition) return;
  try { recognition.stop(); } catch(e) {}
  isRecording = false;
  document.getElementById('voiceBtn').classList.remove('recording');
  document.getElementById('voiceIndicator').classList.remove('active');
}

function toggleLang() {
  isHebrew = !isHebrew;
  currentLang = isHebrew ? 'he-IL' : 'en-US';
  updateLangToggle();
}

function updateLangToggle() {
  document.getElementById('langToggle').textContent = isHebrew ? 'עב' : 'EN';
}

// ============================================================
// TASKS
// ============================================================
function saveTasks() {
  localStorage.setItem('md_tasks', JSON.stringify(tasks));
  updateTaskCount();
}

function updateTaskCount() {
  const active = tasks.filter(t => !t.done).length;
  document.getElementById('taskCount').textContent = active;
  const badge = document.getElementById('taskTabCount');
  badge.textContent = active > 0 ? `(${active})` : '';
}

function filterTasks(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderTasks();
}

function renderTasks() {
  const list = document.getElementById('taskList');

  let filtered = tasks;
  if (currentFilter !== 'all') {
    if (currentFilter === 'done') filtered = tasks.filter(t => t.done);
    else filtered = tasks.filter(t => !t.done && t.priority === currentFilter);
  }

  // Sort: undone first, then by priority
  const order = { urgent: 0, today: 1, later: 2, waiting: 3 };
  filtered = [...filtered].sort((a, b) => {
    if (a.done !== b.done) return a.done ? 1 : -1;
    return (order[a.priority] || 4) - (order[b.priority] || 4);
  });

  list.innerHTML = '';

  if (filtered.length === 0) {
    list.innerHTML = `<div class="empty-tasks">
      <span class="emoji">✨</span>
      ${currentFilter === 'done' ? 'No completed tasks yet.' : 'No tasks here — your head is clear!'}
    </div>`;
    updateTaskCount();
    return;
  }

  filtered.forEach(task => {
    const el = document.createElement('div');
    el.className = 'task-item' + (task.done ? ' done' : '');
    el.innerHTML = `
      <div class="task-check ${task.done ? 'done' : ''}" onclick="toggleTask('${task.id}')">
        ${task.done ? '✓' : ''}
      </div>
      <div class="task-content">
        <div class="task-text">${escHtml(task.text)}</div>
        <div class="task-meta">
          <span class="tag tag-${task.priority || 'default'}">${task.priority || 'task'}</span>
        </div>
      </div>
      <button class="task-del" onclick="deleteTask('${task.id}')">🗑</button>
    `;
    list.appendChild(el);
  });

  updateTaskCount();
}

function toggleTask(id) {
  const task = tasks.find(t => t.id == id);
  if (task) { task.done = !task.done; saveTasks(); renderTasks(); }
}

function deleteTask(id) {
  tasks = tasks.filter(t => t.id != id);
  saveTasks();
  renderTasks();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ============================================================
// SETTINGS
// ============================================================
function openSettings() {
  document.getElementById('settingsOverlay').classList.add('open');
}

function closeSettingsOnBg(e) {
  if (e.target === document.getElementById('settingsOverlay')) closeSettings();
}

function closeSettings() {
  document.getElementById('settingsOverlay').classList.remove('open');
}

function saveSettings() {
  settings.apiKey = document.getElementById('apiKeyInput').value.trim();
  settings.name = document.getElementById('nameInput').value.trim();
  settings.lang = document.getElementById('defaultLang').value;

  currentLang = settings.lang;
  isHebrew = currentLang === 'he-IL';
  updateLangToggle();

  localStorage.setItem('md_settings', JSON.stringify(settings));

  if (settings.apiKey) {
    document.getElementById('apiBadge').textContent = 'AI Ready';
    document.getElementById('apiBadge').className = 'api-badge ok';
  } else {
    document.getElementById('apiBadge').textContent = 'No API Key';
    document.getElementById('apiBadge').className = 'api-badge';
  }

  closeSettings();
}

// ============================================================
// EXPOSE TO WINDOW (required for onclick in module scripts)
// ============================================================
window.switchTab       = switchTab;
window.sendMessage     = sendMessage;
window.handleKey       = handleKey;
window.autoResize      = autoResize;
window.toggleVoice     = toggleVoice;
window.toggleLang      = toggleLang;
window.filterTasks     = filterTasks;
window.toggleTask      = toggleTask;
window.deleteTask      = deleteTask;
window.openSettings    = openSettings;
window.closeSettingsOnBg = closeSettingsOnBg;
window.saveSettings    = saveSettings;
</script>
